<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hockey Stats — Player Streaks</title>
  <link rel="icon" href="/favicon.ico?v=1.6" sizes="any">
  <link rel="icon" href="/favicon.svg?v=1.6" type="image/svg+xml">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=1.6">
  <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192x192.png?v=1.6">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=1.6">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <img class="nhl-logo" src="/img/nhl.svg" alt="NHL">
      <div>
        <h1>Player Streaks</h1>
        <p class="tag">Minimum per game over the last N completed games</p>
      </div>
    </div>
    <div class="toolbar">
      <div class="toolbar-row">
      <nav class="nav">
        <a href="/">Matchups</a>
        <a href="/teams.html">Team Stats</a>
        <a href="/streaks.html" aria-current="page">Player Streaks</a>
        <a href="/review.html">Review</a>
        <a href="/backtest.html">Backtest</a>
      </nav>
      <span class="app-version" title="App version">v1.6</span>
      </div>
      <p id="meta" class="meta meta-line">Loading…</p>
    </div>
  </header>
  <main>
    <form id="controls" class="controls">
      <label>Streak length
        <input id="length" type="number" min="1" max="15" placeholder="5">
      </label>
      <label>Min goals
        <input id="minGoals" type="number" min="0" max="10" value="1">
      </label>
      <label>Min assists
        <input id="minAssists" type="number" min="0" max="10" value="1">
      </label>
      <label>Min points
        <input id="minPoints" type="number" min="0" max="10" value="1">
      </label>
      <label>Min attempts
        <input id="minAttempts" type="number" min="0" max="20" value="3">
      </label>
      <label>Min SOG
        <input id="minSog" type="number" min="0" max="20" value="3">
      </label>
      <label>Min goalie save %
        <input id="minGoalieSv" type="number" min="0" max="100" value="90">
      </label>
      <label class="check"><input id="activeOnly" type="checkbox"> Active this week only</label>
      <button type="submit">Apply</button>
    </form>
    <p id="note" class="note"></p>
    <div id="panels"></div>
  </main>
  <footer>
    <span>v1.6</span>
  </footer>
  <script src="/js/table-filter.js"></script>
  <script src="/js/streaks.js"></script>
  <script src="/js/streaks-app.js"></script>
</body>
</html>
