<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hockey Stats — Download</title>
  <link rel="icon" href="/favicon.ico?v=1.9" sizes="any">
  <link rel="icon" href="/favicon.svg?v=1.9" type="image/svg+xml">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=1.9">
  <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192x192.png?v=1.9">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=1.9">
  <link rel="stylesheet" href="/css/style.css">

<body data-page="download">
  <header class="top">
    <script src="/js/site-nav.js"></script>
    <div class="header-body">
    <div class="brand">
      <img class="site-logo" src="/favicon.svg?v=1.9" alt="Hockey Stats">
      <div>
        <h1>Download</h1>
        <p class="tag">Matchup card rows for every stored 2026-27 game</p>
      </div>
    </div>
    <div class="toolbar">
      <div class="toolbar-row nav-controls">
        <button type="button" id="download-csv">Download CSV</button>
      </div>
      <p id="meta" class="meta meta-line">Loading…</p>
    </div>
    </div>
  </header>
  <main>
    <p id="note" class="note hidden"></p>
    <section class="board">
      <div class="table-wrap">
        <table id="download">
          <thead>
            <tr id="download-head"></tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>
  </main>
  <footer>
    <span>v2.6</span>
  </footer>
  <script src="/js/dates.js"></script>
  <script src="/js/prefs.js"></script>
